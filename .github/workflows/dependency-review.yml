name: Dependency review

on:
  pull_request:
    branches: [develop, prod]

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          # Scoped exceptions (review by 2027-01-31, see docs/ci-security.md):
          # transitive deps pinned by semgrep==1.182.1 (CI-only tool, offline scan).
          # GHSA-84m7-p3x7-pcfv: mcp 1.29.0, MCP HTTP server never started.
          # GHSA-xcq7-p3pf-p88h: opentelemetry-api 1.37.0, no untrusted tracestate input.
          allow-ghsas: GHSA-84m7-p3x7-pcfv, GHSA-xcq7-p3pf-p88h
