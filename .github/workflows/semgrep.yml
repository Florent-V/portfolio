name: Semgrep

on:
  push:
    branches: [develop, prod]
  pull_request:
    branches: [develop, prod]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SEMGREP_RULES_REPO: https://github.com/semgrep/semgrep-rules.git
  # semgrep-rules@develop au 2026-10-21. Mise à jour manuelle (voir la doc).
  SEMGREP_RULES_SHA: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
  SEMGREP_SEND_METRICS: "off"
  SEMGREP_ENABLE_VERSION_CHECK: "0"
  SEMGREP_TARGETS: src config public bin migrations tests

jobs:
  semgrep-diff:
    name: Semgrep (PHP, new findings)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Semgrep CE (pinned, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --disable-pip-version-check --require-hashes -r .github/ci-tools/semgrep/requirements.txt
          "$RUNNER_TEMP/semgrep/bin/semgrep" --version

      - name: Fetch pinned Semgrep rules
        run: |
          # Sparse + partial clone: only php/ is downloaded and written to disk
          # (the repository also holds intentionally malicious test fixtures).
          git init -q "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" sparse-checkout set --no-cone /php/lang/ /php/symfony/ /php/doctrine/
          git -C "$RUNNER_TEMP/semgrep-rules" remote add origin "$SEMGREP_RULES_REPO"
          git -C "$RUNNER_TEMP/semgrep-rules" fetch -q --depth 1 --filter=blob:none origin "$SEMGREP_RULES_SHA"
          git -C "$RUNNER_TEMP/semgrep-rules" checkout -q FETCH_HEAD

      - name: Semgrep scan (findings not present on the base commit)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          rules="$RUNNER_TEMP/semgrep-rules/php"
          # shellcheck disable=SC2086 # SEMGREP_TARGETS est une liste de chemins
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan \
            --metrics=off --disable-version-check --error \
            --severity WARNING --severity ERROR \
            --config "$rules/lang" --config "$rules/symfony" --config "$rules/doctrine" \
            --baseline-commit "$BASE_SHA" \
            $SEMGREP_TARGETS

  semgrep-full:
    name: Semgrep (PHP, full scan)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep CE (pinned, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --disable-pip-version-check --require-hashes -r .github/ci-tools/semgrep/requirements.txt
          "$RUNNER_TEMP/semgrep/bin/semgrep" --version

      - name: Fetch pinned Semgrep rules
        run: |
          # Sparse + partial clone: only php/ is downloaded and written to disk
          # (the repository also holds intentionally malicious test fixtures).
          git init -q "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" sparse-checkout set --no-cone /php/lang/ /php/symfony/ /php/doctrine/
          git -C "$RUNNER_TEMP/semgrep-rules" remote add origin "$SEMGREP_RULES_REPO"
          git -C "$RUNNER_TEMP/semgrep-rules" fetch -q --depth 1 --filter=blob:none origin "$SEMGREP_RULES_SHA"
          git -C "$RUNNER_TEMP/semgrep-rules" checkout -q FETCH_HEAD

      - name: Semgrep scan (full)
        run: |
          rules="$RUNNER_TEMP/semgrep-rules/php"
          # shellcheck disable=SC2086 # SEMGREP_TARGETS est une liste de chemins
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan \
            --metrics=off --disable-version-check --error \
            --severity WARNING --severity ERROR \
            --config "$rules/lang" --config "$rules/symfony" --config "$rules/doctrine" \
            --sarif-output semgrep.sarif \
            $SEMGREP_TARGETS

      # Envoyé même si le scan a échoué à cause de résultats : les alertes
      # restent visibles dans Security > Code scanning.
      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep-php
