name: Deploy

on:
    push:
        branches: [prod]
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    deploy:
        name: Deploy to Production
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install npm dependencies
              run: npm ci

            - name: Build assets
              run: npm run build
              env:
                  NODE_ENV: production

            - name: Setup SSH agent
              uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Add server to known hosts
              run: ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

            - name: Transfer built assets to server
              run: |
                  rsync -avz --delete \
                    -e "ssh -p ${{ secrets.SSH_PORT }}" \
                    public/build/ \
                    ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/public/build/

                  rsync -avz \
                    -e "ssh -p ${{ secrets.SSH_PORT }}" \
                    public/manifest.json \
                    public/service-worker.js \
                    ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/public/

                  rsync -avz --delete \
                    -e "ssh -p ${{ secrets.SSH_PORT }}" \
                    public/pwa/ \
                    ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/public/pwa/

            - name: Run deploy script on server
              run: |
                  ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "bash ~/deploy-portfolio.sh"

            - name: Notify success
              if: success()
              run: echo "🎉 Déploiement réussi"

            - name: Notify failure
              if: failure()
              run: echo "💥 Échec du déploiement"
