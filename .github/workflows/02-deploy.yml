name: Deploy

on:
    push:
        branches: [prod]
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    deploy:
        name: Deploy to Production
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_mysql, intl, zip
                  coverage: none
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction --no-scripts

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install npm dependencies
              run: npm ci

            - name: Build assets
              run: npm run build
              env:
                  NODE_ENV: production

            - name: Setup SSH agent
              uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Add server to known hosts
              run: ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

            - name: Transfer built assets to server
              run: |
                  rsync -rlvzO --delete --no-perms \
                    -e "ssh -p ${{ secrets.SSH_PORT }}" \
                    public/build/ \
                    ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/public/build/

                  rsync -rlvzO --no-perms \
                    -e "ssh -p ${{ secrets.SSH_PORT }}" \
                    public/manifest.json \
                    public/service-worker.js \
                    ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/public/

                  rsync -rlvzO --delete --no-perms \
                    -e "ssh -p ${{ secrets.SSH_PORT }}" \
                    public/pwa/ \
                    ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/public/pwa/

            - name: Run deploy script on server
              run: |
                  ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "bash ~/deploy-portfolio.sh"

            - name: Notify success
              if: success()
              run: echo "🎉 Déploiement réussi"

            - name: Notify failure
              if: failure()
              run: echo "💥 Échec du déploiement"
